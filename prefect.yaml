pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/peteaxtell/automations.git
      branch: main
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ clone-step.directory }}"

deployments:
  - name: hotel-rates-report
    entrypoint: automations.flows.hotels:run_trips_report
    schedules:
        - cron: "0 9 * * *"
          timezone: "Europe/London"
    parameters:
      recipients: ["axtellpete@gmail.com"]
    work_pool:
      name: managed-workpool
  - name: hotel-calendar-report
    entrypoint: automations.flows.hotels:run_calendar_report
    schedules:
        - cron: "0 9 * * *" 
          timezone: "Europe/London"
    work_pool:
      name: managed-workpool 
  - name: process-mailbox-alert
    entrypoint: automations.flows.gmail:process_mailbox_alert
    work_pool:
      name: managed-workpool
  - name: send-market-summary
    entrypoint: automations.flows.market_summary.send_market_summary
    work_pool:
      name: managed-workpool
    schedules:
        - cron: "30 4 * * 1-5" 
          timezone: "Europe/London"
        - cron: "45 7 * * 1-5" 
          timezone: "Europe/London"